<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>simple-todo-tab</title>
    <link rel="stylesheet" href="/src/newtab.css">
</head>
<body>
    <main id="app" class="app-shell">
        <section class="todo-card" aria-labelledby="title">
            <h1 id="title" class="app-title">今日のやること</h1>

            <div id="focus-container" class="focus-panel" role="status" aria-live="polite">
                <div id="focus-label" class="focus-label">今集中すること</div>
                <div id="focus-text" class="focus-text"></div>
            </div>

            <form id="task-entry" class="task-entry" aria-describedby="task-status">
                <label id="task-input-label" class="visually-hidden" for="task-input">今日やることを入力</label>
                <input type="text" id="task-input" class="task-input" placeholder="何をしますか？" autocomplete="off" aria-labelledby="task-input-label">
                <button id="add-button" class="add-button" type="submit" aria-controls="task-list">追加</button>
            </form>

            <div id="onboarding-guide" class="onboarding-guide" role="note">まず1つだけ書いて追加。新しいタブで今日やることにすぐ戻れます。</div>
            <div id="empty-state" class="empty-state" hidden>
                <div id="empty-state-title" class="empty-state-title">まだ何もありません</div>
                <p id="empty-state-description" class="empty-state-description">今日やることを短く書くと、このタブがシンプルなチェックリストになります。</p>
                <button id="empty-state-action" class="empty-state-action" type="button">入力欄に移動</button>
            </div>

            <div id="task-status" class="status-message" role="status" aria-live="polite">読み込み中...</div>
            <ul id="task-list" class="task-list" aria-describedby="task-status"></ul>

            <hr class="section-divider">

            <div id="premium-section" class="premium-section">
                <div id="premium-gate" class="premium-gate">
                    <span id="gate-message"></span>
                    <a id="upgrade-link" class="upgrade-link" href="https://checkout.stripe.com/c/dummy" target="_blank">プレミアムにアップグレード</a>
                </div>

                <div id="premium-features" class="premium-features">
                    <div class="premium-status" id="premium-status">プレミアム利用中</div>
                    <div class="theme-row">
                        <label for="theme-color" id="theme-label">背景色</label>
                        <input type="color" id="theme-color" value="#f0f2f5" aria-label="背景色">
                    </div>
                    <div id="history-container" class="history-container" role="region" aria-labelledby="history-title">
                        <div class="history-title" id="history-title">完了履歴</div>
                        <div id="history-status" class="history-status" aria-live="polite"></div>
                        <ul id="history-list" class="history-list"></ul>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script type="module" src="/src/newtab.ts"></script>
</body>
</html>
