<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>simple-todo-tab</title>
    <link rel="stylesheet" href="/src/newtab.css">
</head>
<body>
    <main id="app" class="app-shell">
        <section class="todo-card" aria-labelledby="title">
            <h1 id="title" class="app-title">今日のやること</h1>

            <div id="focus-container" class="focus-panel">
                <div id="focus-label" class="focus-label">いま集中すること</div>
                <div id="focus-text" class="focus-text"></div>
            </div>

            <div class="task-entry">
                <input type="text" id="task-input" class="task-input" placeholder="なにする？">
                <button id="add-button" class="add-button" type="button">追加</button>
            </div>

            <div id="task-status" class="status-message" role="status" aria-live="polite">読み込み中...</div>
            <ul id="task-list" class="task-list"></ul>

            <hr class="section-divider">

            <div id="premium-section" class="premium-section">
                <div id="premium-gate" class="premium-gate">
                    <span id="gate-message"></span>
                    <a id="upgrade-link" class="upgrade-link" href="https://checkout.stripe.com/c/dummy" target="_blank">Upgrade</a>
                </div>

                <div id="premium-features" class="premium-features">
                    <div class="premium-status" id="premium-status">Premium Active</div>
                    <div class="theme-row">
                        <label for="theme-color" id="theme-label">Background Color</label>
                        <input type="color" id="theme-color" value="#f0f2f5" aria-label="Background Color">
                    </div>
                    <div id="history-container" class="history-container">
                        <div class="history-title" id="history-title">Completion History</div>
                        <div id="history-status" class="history-status" aria-live="polite"></div>
                        <ul id="history-list" class="history-list"></ul>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script type="module" src="/src/newtab.ts"></script>
</body>
</html>
